name: Build TaskWidget (Windows)
on:
  workflow_dispatch:
  push:
    paths: ['taskwidget/**']
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: taskwidget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npx tauri icon app-icon.png
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: TaskWidget-windows
          path: |
            taskwidget/src-tauri/target/release/bundle/nsis/*.exe
            taskwidget/src-tauri/target/release/taskwidget.exe
